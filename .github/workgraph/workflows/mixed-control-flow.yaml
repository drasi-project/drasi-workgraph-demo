apiVersion: workgraph.drasi.io/v1
kind: IssueWorkflow
metadata:
  id: mixed-control-flow

spec:
  trigger: workgraph
  initial: a
  defaults:
    evaluator: result-evaluator
    orchestrator: workflow-coordinator
    maxReworkAttempts: 3
  steps:
    a:
      type: task
      operation: intake-issue
      worker: issue-worker
      inputs: {}
      next: b
    b:
      type: task
      operation: normalize-issue
      worker: issue-worker
      inputs: {}
      next: c
    c:
      type: task
      operation: triage-issue
      worker: issue-worker
      inputs: {}
      outcomes:
        parallel: g
        reject: ignored
        skip: h
    g:
      type: task
      operation: coordinate-validation
      worker: issue-worker
      inputs: {}
      children:
        join: all
        tasks:
          d:
            operation: validate-title
            worker: issue-validator
            inputs:
              field: title
          e:
            operation: validate-body
            worker: issue-validator
            inputs:
              field: body
          f:
            operation: validate-reproduction
            worker: issue-validator
            inputs:
              section: reproduction
      next: h
    h:
      type: task
      operation: finalize-issue
      worker: issue-worker
      inputs: {}
      next: completed
    completed:
      type: terminal
      outcome: completed
    ignored:
      type: terminal
      outcome: ignored
