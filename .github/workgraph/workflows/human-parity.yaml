apiVersion: workgraph.drasi.io/v1
kind: IssueWorkflow
metadata:
  id: human-parity

spec:
  trigger: workgraph
  initial: draft
  defaults:
    evaluator: result-evaluator
    orchestrator: workflow-coordinator
    maxReworkAttempts: 3
  steps:
    draft:
      type: task
      operation: draft-proposal
      worker: human-agentofreality
      inputs: {}
      instructions:
        summary: Draft the remediation proposal for this Issue.
        details: Read the Root Issue and write the proposal you would hand to an implementer, then reply on this task with a comment that opens with the WorkGraph mention and states the proposal in your own words.
        acceptanceCriteria:
          - The proposal names the change being proposed.
          - The proposal states why the change is needed.
          - The proposal lists the checks that would prove it worked.
        resultSchema:
          proposal: string
          rationale: string
      next: review
    review:
      type: task
      operation: normalize-issue
      worker: issue-worker
      evaluator: human-agentofreality
      inputs: {}
      instructions:
        summary: Normalize the verified Root Issue into a structured summary.
        details: Read the Root Issue title and body returned by the reporter and restate them as a normalized summary. Use only what the Root Issue says; do not infer, judge, or add anything it does not state.
        acceptanceCriteria:
          - The summary restates the Root Issue title.
          - The summary restates what the Root Issue body asks for.
          - The summary adds no claim the Root Issue does not make.
      next: completed
    completed:
      type: terminal
      outcome: completed
