apiVersion: workgraph.drasi.io/v1
kind: IssueWorkflow
metadata:
  id: issue-lifecycle

spec:
  trigger: workgraph
  initial: A
  defaults:
    evaluator: result-evaluator
    orchestrator: workflow-coordinator
    maxRework: 3
    rework:
      task: same
      assignment: same
      attempt: fresh
  steps:
    A:
      name: intake
      type: task
      operation: intake-issue
      agent: issue-worker
      next: B
    B:
      name: normalize
      type: task
      operation: normalize-issue
      agent: issue-worker
      next: C
    C:
      name: validate
      type: task
      operation: validate-issue
      agent: issue-validator
      evaluator: issue-validation-evaluator
      outcomes:
        - outcome: needs-info
          verdict: accepted
          target: D
        - outcome: continue
          verdict: accepted
          target: E
        - outcome: reject
          verdict: accepted
          target: F
    D:
      name: request-info
      type: task
      operation: request-information
      agent: issue-info-requester
      next:
        waitFor: root-issue-comment
        where:
          rootIssue: true
          authorType: non-agent-human
        target: C
    E:
      name: triage
      type: task
      operation: triage-issue
      agent: issue-worker
      next: G
    F:
      name: record-rejection
      type: task
      operation: record-rejection
      agent: issue-worker
      next: ignored
    G:
      name: parallel-validation
      type: task
      operation: coordinate-validation
      agent: issue-worker
      orchestrator: validation-stage-coordinator
      maxRework: 2
      children:
        - id: G-title
          name: validate-title
          operation: validate-title
          agent: issue-validator
        - id: G-body
          name: validate-body
          operation: validate-body
          agent: issue-validator
        - id: G-reproduction
          name: validate-reproduction
          operation: validate-reproduction
          agent: issue-validator
      join:
        mode: all
        require: accepted
        coordinator: after-children
      next: H
    H:
      name: finalize
      type: task
      operation: finalize-issue
      agent: issue-worker
      next: completed
  terminals:
    ignored:
      status: ignored
    completed:
      status: completed
