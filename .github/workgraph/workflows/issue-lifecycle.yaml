apiVersion: workgraph.drasi.io/v1
kind: IssueWorkflow
metadata:
  id: issue-lifecycle

spec:
  trigger: workgraph
  initial: a
  defaults:
    evaluator: result-evaluator
    orchestrator: workflow-coordinator
    maxReworkAttempts: 3
  steps:
    a:
      type: task
      operation: intake-issue
      worker: issue-worker
      inputs: {}
      next: b
    b:
      type: task
      operation: normalize-issue
      worker: issue-worker
      inputs: {}
      next: c
    c:
      type: task
      operation: validate-issue
      worker: issue-validator
      inputs:
        profile: new-issue-default
      evaluator: issue-validation-evaluator
      outcomes:
        needs-info: d
        continue: e
        reject: f
    d:
      type: task
      operation: request-information
      worker: issue-info-requester
      inputs:
        source: c
      outcomes:
        requested: human
    human:
      type: wait
      event: root-issue-commented
      next: c
    e:
      type: task
      operation: triage-issue
      worker: issue-worker
      inputs: {}
      next: g
    f:
      type: task
      operation: record-rejection
      worker: issue-worker
      inputs: {}
      outcomes:
        ignored: ignored
    g:
      type: task
      operation: coordinate-validation
      worker: issue-worker
      inputs: {}
      orchestrator: validation-stage-coordinator
      maxReworkAttempts: 2
      children:
        join: all
        tasks:
          title:
            operation: validate-title
            worker: issue-validator
            inputs:
              field: title
          body:
            operation: validate-body
            worker: issue-validator
            inputs:
              field: body
          reproduction:
            operation: validate-reproduction
            worker: issue-validator
            inputs:
              section: reproduction
      next: h
    h:
      type: task
      operation: finalize-issue
      worker: issue-worker
      inputs: {}
      outcomes:
        completed: completed
    completed:
      type: terminal
      outcome: completed
    error:
      type: terminal
      outcome: error
    ignored:
      type: terminal
      outcome: ignored
