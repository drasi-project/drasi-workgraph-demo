apiVersion: workgraph.drasi.io/v1
kind: IssueWorkflow
metadata:
  id: issue-lifecycle

spec:
  initial: a
  defaults:
    evaluator: result-evaluator
    orchestrator: workflow-coordinator
    maxReworkAttempts: 3
  steps:
    a:
      type: task
      operation: intake-issue
      worker: {"candidates": ["issue-worker"], "selection": "first-available"}
      inputs: {}
      next: b
    b:
      type: task
      operation: normalize-issue
      worker: {"candidates": ["issue-worker"], "selection": "first-available"}
      inputs: {}
      next: c
    c:
      type: task
      operation: inspect-issue
      worker: {"candidates": ["issue-worker"], "selection": "first-available"}
      inputs: {}
      next: d
    d:
      type: task
      operation: finalize-issue
      worker: {"candidates": ["issue-worker"], "selection": "first-available"}
      inputs: {}
      next: completed
    completed:
      type: terminal
      outcome: completed
