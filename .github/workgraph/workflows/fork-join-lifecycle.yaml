apiVersion: workgraph.drasi.io/v1
kind: IssueWorkflow
metadata:
  id: fork-join-lifecycle

spec:
  initial: a
  defaults:
    evaluator: result-evaluator
    orchestrator: workflow-coordinator
    maxReworkAttempts: 3
  steps:
    a:
      type: task
      operation: prepare-parallel-work
      worker: {"candidates": ["issue-worker"], "selection": "first-available"}
      inputs: {}
      next: b
    b:
      type: task
      operation: aggregate-child-results
      worker: {"candidates": ["issue-worker"], "selection": "first-available"}
      inputs: {}
      children:
        tasks:
          c:
            operation: inspect-title
            worker: {"candidates": ["issue-worker"], "selection": "first-available"}
            inputs: {}
          d:
            operation: inspect-body
            worker: {"candidates": ["issue-worker"], "selection": "first-available"}
            inputs: {}
          e:
            operation: inspect-risk
            worker: {"candidates": ["issue-worker"], "selection": "first-available"}
            inputs: {}
      next: f
    f:
      type: task
      operation: synthesize-results
      worker: {"candidates": ["issue-worker"], "selection": "first-available"}
      inputs: {}
      next: g
    g:
      type: task
      operation: finalize-parallel-work
      worker: {"candidates": ["issue-worker"], "selection": "first-available"}
      inputs: {}
      next: completed
    completed:
      type: terminal
      outcome: completed
